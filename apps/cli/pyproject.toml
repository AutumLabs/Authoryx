[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authoryxos-cli"
version = "0.1.0"
description = "AuthoryxOS CLI — scan, init, audit, fetch."
requires-python = ">=3.10"
dependencies = [
  "authoryxos",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
authoryxos = "authoryxos_cli.main:main"

[tool.setuptools.packages.find]
include = ["authoryxos_cli*"]
