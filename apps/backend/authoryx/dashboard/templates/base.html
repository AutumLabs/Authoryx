<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}AuthoryxOS{% endblock %}</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
      --muted: #8b949e; --accent: #2f81f7; --green: #238636; --red: #da3633;
      --amber: #9e6a03;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel);
    }
    header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
    header .tag { color: var(--muted); font-size: 12px; margin-left: 8px; }
    a { color: var(--accent); text-decoration: none; }
    main { max-width: 1000px; margin: 0 auto; padding: 24px; }
    section { margin-bottom: 32px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    code { background: #010409; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .intent { color: var(--text); max-width: 380px; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 12px; font-size: 11px; border: 1px solid var(--border); }
    .pill.approved { color: #3fb950; border-color: #238636; }
    .pill.denied { color: #f85149; border-color: var(--red); }
    .pill.pending { color: #d29922; border-color: var(--amber); }
    .pill.expired { color: var(--muted); }
    button, input[type=submit] {
      font: inherit; cursor: pointer; border: 1px solid var(--border);
      background: #21262d; color: var(--text); padding: 6px 12px; border-radius: 6px;
    }
    button.approve { background: var(--green); border-color: var(--green); }
    button.deny { background: var(--red); border-color: var(--red); }
    input, select { font: inherit; background: #010409; color: var(--text); border: 1px solid var(--border); padding: 6px 8px; border-radius: 6px; }
    form.inline { display: inline; }
    .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items: end; }
    .banner { background: #0b2a4a; border: 1px solid var(--accent); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; word-break: break-all; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div><h1>AuthoryxOS</h1><span class="tag">owner console · {{ env|default('dev') }}</span></div>
    <nav>{% block nav %}<a href="/dashboard/logout">Sign out</a>{% endblock %}</nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
