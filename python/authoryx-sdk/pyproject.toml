[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "authoryx"
version = "0.1.0" # x-release-please-version
description = "Python client for the Authoryx agent API: list circles and secrets, ask, wait for the owner's answer, fetch for scripts."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "AutumLabs" }]
keywords = ["authoryx", "agents", "secrets", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/AutumLabs/Authoryx"
Source = "https://github.com/AutumLabs/Authoryx/tree/main/python/authoryx-sdk"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["authoryx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
